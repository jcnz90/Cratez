# Pushes to rebrand build test installers (Actions tab > run > Artifacts); a v* tag publishes a release.
name: Release

on:
  push:
    branches: [rebrand]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Cratez.exe
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Cratez --icon icon.ico --add-data "ui;ui" app.py
      - name: Fetch ffmpeg
        run: python installer/get_ffmpeg.py
      - name: Build the installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path app.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DAppVersion=$ver" installer\windows\cratez.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: cratez-windows
          path: dist/Cratez-Setup-*.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Cratez.app and the disk image
        run: bash build.command
      - uses: actions/upload-artifact@v4
        with:
          name: cratez-mac
          path: dist/Cratez-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
            branding/thumbnail.png
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
